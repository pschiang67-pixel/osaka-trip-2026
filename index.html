                // ================= METHODS =================
                async init() {
                    const auth = window.auth;
                    try {
                        if (window.firebaseReady) {
                            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                                await window.signInWithCustomToken(auth, __initial_auth_token);
                            } else {
                                await window.signInAnonymously(auth);
                            }
                        }
                    } catch (e) {
                        console.error("Authentication failed:", e);
                    }

                    if (window.onAuthStateChanged) {
                        window.onAuthStateChanged(auth, (user) => {
                            if (user) {
                                this.userId = user.uid;
                                this.listenToExpenses();
                            }
                        });
                    }
                },

                listenToExpenses() {
                    if (!this.userId || !window.firebaseReady) return;
                    const q = window.query(
                        window.collection(window.db, 'artifacts', window.appId, 'users', this.userId, 'expenses'),
                        window.orderBy('createdAt', 'desc')
                    );
                    
                    window.onSnapshot(q, (snapshot) => {
                        const newExpenses = [];
                        snapshot.forEach((doc) => {
                            newExpenses.push({ id: doc.id, ...doc.data() });
                        });
                        this.expenses = newExpenses;
                        this.calculateTotal();
                    }, (error) => {
                        console.error("Firestore error:", error);
                    });
                },

                calculateTotal() {
                    this.totalExpenseJPY = this.expenses.reduce((sum, item) => sum + item.amount, 0);
                },

                async addExpense() {
                    if (!this.userId || !this.newExpense.name || !this.newExpense.amount) return;
                    
                    const amount = parseInt(this.newExpense.amount);
                    const expenseData = {
                        name: this.newExpense.name,
                        amount: amount,
                        amountTWD: Math.round(amount * this.exchangeRate),
                        category: this.newExpense.category,
                        paymentMethod: this.newExpense.paymentMethod,
                        date: new Date().toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric' }),
                        createdAt: Date.now()
                    };

                    try {
                        await window.addDoc(
                            window.collection(window.db, 'artifacts', window.appId, 'users', this.userId, 'expenses'),
                            expenseData
                        );
                        // Reset form
                        this.newExpense.name = '';
                        this.newExpense.amount = '';
                        this.showAddExpense = false;
                        this.showCategoryMenu = false;
                    } catch (e) {
                        console.error("Add failed", e);
                    }
                },

                async deleteExpense(id) {
                    if (!this.userId || !id) return;
                    if(!confirm("確定要刪除這筆紀錄嗎？")) return;

                    try {
                        await window.deleteDoc(
                            window.doc(window.db, 'artifacts', window.appId, 'users', this.userId, 'expenses', id)
                        );
                    } catch (e) {
                        console.error("Delete failed", e);
                    }
                },
                
                getCategory(id) {
                    return this.categories.find(c => c.id === id) || this.categories[0];
                },
                
                openModal(spot) {
                    this.selectedEvent = spot;
                    this.showDetailModal = true;
                },

                closeModal() {
                    this.showDetailModal = false;
                },

                openFoodModal(foodItem) {
                    this.selectedFood = foodItem;
                    this.showFoodModal = true;
                },
                
                closeFoodModal() {
                    this.showFoodModal = false;
                    this.selectedFood = null;
                },

                changeDay(index) {
                    this.selectedDay = index;
                }
            }
        }

    <style>
        /* Base Settings - Vintage Beige Mode */
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #e2ded3; /* Vintage Beige Background */
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;

        }

        /* App Container - Vintage Beige Mode */
        #app-frame {
            max-width: 480px;
            margin: 0 auto;
            background-color: #e2ded3; /* Match body background */
            height: 100vh;
            max-height: 100vh;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.05); /* Softer shadow */
            display: flex;
            flex-direction: column;
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Font Setting for FangSong style */
        .font-fangsong {
            font-family: "Huiwen Fangsong", "FangSong", "STFangsong", "Noto Serif TC", serif;
        }

        /* Washi Paper Texture for Modals */
        .washi-paper {
            background-color: #fffdf6; /* Warm Ivory */
            background-image: url("data:image/svg+xml,%3Csvg width='200' height='200' viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E");
        }
        
        /* Utility class for masking image edges to fade into background */
        .img-mask-fade {
            -webkit-mask-image: radial-gradient(ellipse at center, black 60%, transparent 100%);
            mask-image: radial-gradient(ellipse at center, black 60%, transparent 100%);
        }

        /* Gold Gradient Text */
        .gold-text {
            color: #bfa15f; /* Fallback */
            background: linear-gradient(45deg, #bf953f, #cfb53b, #b38728, #e3c457, #aa771c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Floating Card Style (Warm Ivory on Beige Bg) */
        .float-card {
            background-color: #fffdf6; /* Warm Ivory Card */
            border-radius: 1.2rem;
            /* Layered shadow for floating effect */
            box-shadow: 
                0 4px 6px -1px rgba(0, 0, 0, 0.05), 
                0 12px 20px -4px rgba(0, 0, 0, 0.05);
            /* Very subtle white border to make it pop */
            border: 1px solid rgba(255, 255, 255, 0.6); 
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .float-card:active {
            transform: scale(0.98);
            box-shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        /* Hero Image Card Height */
        .hero-overlay {
            position: absolute;
            inset: 0;
            /* Seamless blend to #e2ded3 */
            /* Adjusted gradient stops to cover the subtitle text area (approx bottom-12) with more opacity */
            background: linear-gradient(to bottom, 
                rgba(0,0,0,0.2) 0%, 
                rgba(0,0,0,0) 40%, 
                rgba(226,222,211,0.6) 70%, 
                rgba(226,222,211,0.95) 90%, 
                #e2ded3 100%);
        }

        /* Frosted Glass - Weather Widget */
        .glass-weather {
            background: rgba(255, 255, 255, 0.5); /* Lighter glass */

        /* Scrollable Content Container */

    <!-- Sakura Animation Script (Updated colors for light theme) -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('sakura-canvas');
            const ctx = canvas.getContext('2d');
            let width, height;
            function resize() {
                const rect = canvas.parentElement.getBoundingClientRect();
                width = rect.width; height = rect.height; canvas.width = width; canvas.height = height;
            }
            window.addEventListener('resize', resize);
            resize();
            const petals = [];
            const totalPetals = 30;

            class Petal {
                constructor() { this.reset(); }
                reset() {
                    this.x = Math.random() * width; this.y = Math.random() * -height;
                    this.type = Math.random() > 0.8 ? 'flower' : 'petal';
                    this.size = this.type === 'flower' ? Math.random() * 2 + 6 : Math.random() * 3 + 7;
                    this.colorType = Math.random() > 0.7 ? 'peach' : 'light';
                    this.speedX = Math.random() * 1 - 0.5; this.speedY = Math.random() * 1.2 + 0.8;
                    this.rotation = Math.random() * 360; this.rotationSpeed = Math.random() * 2 - 1;
                    this.opacity = Math.random() * 0.4 + 0.5;
                }
                update() {
                    this.x += this.speedX + Math.sin(this.y * 0.005) * 0.5; this.y += this.speedY; this.rotation += this.rotationSpeed;
                    if (this.y > height + 20) { this.reset(); }
                }
                drawPetalPath(s) {
                    ctx.beginPath(); ctx.moveTo(0, 0); ctx.bezierCurveTo(-s, -s * 0.5, -s * 0.5, -s * 1.5, 0, -s); ctx.bezierCurveTo(s * 0.5, -s * 1.5, s, -s * 0.5, 0, 0); ctx.closePath();
                }
                draw() {
                    ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.rotation * Math.PI / 180); ctx.globalAlpha = this.opacity;
                    let gradient = ctx.createLinearGradient(-this.size, -this.size, 0, this.size);
                    // Darker pinks for light background visibility
                    if (this.colorType === 'peach') {
                        gradient.addColorStop(0, "rgba(255, 182, 193, 1)"); gradient.addColorStop(1, "rgba(255, 105, 180, 1)"); 
                    } else {
                        gradient.addColorStop(0, "rgba(255, 240, 245, 1)"); gradient.addColorStop(1, "rgba(255, 192, 203, 1)"); 
                    }
                    ctx.fillStyle = gradient;
                    if (this.type === 'flower') {
                        for (let i = 0; i < 5; i++) {
                            ctx.save(); ctx.rotate((72 * i) * Math.PI / 180); ctx.translate(0, -this.size * 0.2); this.drawPetalPath(this.size); ctx.fill(); ctx.restore();
                        }
                        ctx.beginPath(); ctx.arc(0, 0, this.size * 0.25, 0, Math.PI * 2); ctx.fillStyle = this.colorType === 'peach' ? 'rgba(255, 255, 150, 0.9)' : 'rgba(255, 255, 200, 0.9)'; ctx.fill();
                    } else {
                        this.drawPetalPath(this.size); ctx.fill();
                    }
                    ctx.restore();
                }
            }
            for (let i = 0; i < totalPetals; i++) { petals.push(new Petal()); }
            function animate() { ctx.clearRect(0, 0, width, height); petals.forEach(petal => { petal.update(); petal.draw(); }); requestAnimationFrame(animate); }
            animate();
        });
    </script>

                async init() {
                    const ops = window.firebaseOps;
                    const auth = window.auth;
                    if(window.firebaseReady) {
                        try {
                            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                                await ops.signInWithCustomToken(auth, __initial_auth_token);
                            } else {
                                await ops.signInAnonymously(auth);
                            }
                        } catch(e) { console.error(e); }
                        
                        ops.onAuthStateChanged(auth, (user) => {
                            if(user) {
                                this.userId = user.uid;
                                this.listenExpenses();
                            }
                        });
                    }
                },
                
                listenExpenses() {
                    if(!this.userId) return;
                    const ops = window.firebaseOps;
                    const q = ops.query(ops.collection(window.db, 'artifacts', window.appId, 'users', this.userId, 'expenses'), ops.orderBy('createdAt', 'desc'));
                    ops.onSnapshot(q, (snapshot) => {
                        this.expenses = [];
                        snapshot.forEach(doc => this.expenses.push({id: doc.id, ...doc.data()}));
                        this.totalExpenseJPY = this.expenses.reduce((sum, i) => sum + i.amount, 0);
                    });
                },

                async addExpense() {
                    if(!this.userId || !this.newExpense.name || !this.newExpense.amount) return;
                    const ops = window.firebaseOps;
                    const amt = parseInt(this.newExpense.amount);
                    await ops.addDoc(ops.collection(window.db, 'artifacts', window.appId, 'users', this.userId, 'expenses'), {
                        name: this.newExpense.name,
                        amount: amt,
                        amountTWD: Math.round(amt * this.exchangeRate),
                        category: this.newExpense.category,
                        paymentMethod: this.newExpense.paymentMethod,
                        date: new Date().toLocaleDateString('zh-TW', {month:'numeric', day:'numeric'}),
                        createdAt: Date.now()
                    });
                    this.newExpense.name = ''; this.newExpense.amount = '';
                    this.showAddExpense = false;
                },

                async deleteExpense(id) {
                    if(!confirm("刪除此紀錄？")) return;
                    const ops = window.firebaseOps;
                    await ops.deleteDoc(ops.doc(window.db, 'artifacts', window.appId, 'users', this.userId, 'expenses', id));
                },

                getCategory(id) { return this.categories.find(c => c.id === id) || this.categories[0]; },
                openModal(spot) { this.selectedEvent = spot; this.showDetailModal = true; },
                closeModal() { this.showDetailModal = false; },
                openFoodModal(item) { this.selectedFood = item; this.showFoodModal = true; },
                closeFoodModal() { this.showFoodModal = false; },
                changeDay(idx) { this.selectedDay = idx; }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>

t.foodList"><button @click="openFoodModal(food)" class="flex items-center p-3 bg-white border border-stone-200 rounded-xl shadow-sm hover:shadow-md transition-all text-left w-full group"><div class="w-8 h-8 rounded-lg bg-[#fff5f7] text-rose-400 border border-rose-100 flex items-center justify-center mr-3 group-hover:bg-rose-400 group-hover:text-white"><i class="fas fa-camera text-xs"></i></div><span class="text-xs font-bold text-stone-700 font-fangsong" x-text="food.name"></span></button></template></div></div><div x-show="selectedEvent.tips" class="flex-shrink-0"><h3 class="font-bold text-stone-800 mb-2 text-xs flex items-center uppercase font-fangsong border-b border-stone-200 pb-1 gold-text"><i class="fas fa-info-circle text-[#d4af37] mr-2"></i> 貼心小提醒</h3><p class="text-xs text-stone-600 leading-relaxed pl-6 border-l-2 border-[#d4af37] ml-1 py-1" x-html="selectedEvent.tips"></p></div><div class="pt-4"><a :href="selectedEvent.navLink ? selectedEvent.navLink : 'https://www.google.com/maps'" target="_blank" class="flex items-center justify-center w-full bg-rose-400 text-white py-4 rounded-xl font-bold shadow-lg shadow-rose-200 hover:bg-rose-500 active:scale-95 transition-all text-sm border border-rose-300"><i class="fas fa-location-arrow mr-2"></i> 導航去</a></div></div></template></div>

                <div class="space-y-3"><input type="text" x-model="newExpense.name" placeholder="項目名稱" class="w-full bg-white border border-stone-200 shadow-sm rounded-xl p-3 text-sm font-medium focus:ring-2 focus:ring-stone-400 outline-none text-stone-700 placeholder-stone-400"><div class="relative"><span class="absolute left-4 top-1/2 -translate-y-1/2 text-stone-400 font-bold text-sm">¥</span><input type="number" x-model="newExpense.amount" placeholder="0" class="w-full bg-white border border-stone-200 shadow-sm rounded-xl p-3 pl-8 text-lg font-bold focus:ring-2 focus:ring-stone-400 outline-none text-stone-800 placeholder-stone-400"><div class="absolute right-4 top-1/2 -translate-y-1/2 text-[10px] text-stone-400" x-show="newExpense.amount > 0">≈ NT$ <span x-text="Math.round(newExpense.amount * exchangeRate).toLocaleString()"></span></div></div><div class="bg-white p-1 rounded-xl flex shadow-sm border border-stone-200"><template x-for="method in paymentMethods" :key="method.id"><button @click="newExpense.paymentMethod = method.id" class="flex-1 py-2 rounded-lg text-[10px] font-bold transition-all flex items-center justify-center gap-2" :class="newExpense.paymentMethod === method.id ? 'bg-stone-800 text-white shadow-md' : 'text-stone-400 hover:bg-stone-50'"><i :class="method.icon"></i> <span x-text="method.name"></span></button></template></div><div class="relative"><button @click="showCategoryMenu = !showCategoryMenu" class="w-full bg-white shadow-sm border border-stone-200 rounded-xl p-3 flex items-center justify-between text-xs font-bold text-stone-700"><div class="flex items-center gap-3"><div class="w-5 h-5 rounded-full flex items-center justify-center text-[10px]" :class="getCategory(newExpense.category).color"><i :class="getCategory(newExpense.category).icon"></i></div><span x-text="getCategory(newExpense.category).name"></span></div><i class="fas fa-chevron-down text-stone-400"></i></button><div x-show="showCategoryMenu" @click.away="showCategoryMenu = false     <!-- Sakura Animation Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('sakura-canvas');
            const ctx = canvas.getContext('2d');
            let width, height;
            function resize() {
                const rect = canvas.parentElement.getBoundingClientRect();
                width = rect.width; height = rect.height; canvas.width = width; canvas.height = height;
            }
            window.addEventListener('resize', resize);
            resize();
            const petals = [];
            const totalPetals = 30;

            class Petal {
                constructor() { this.reset(); }
                reset() {
                    this.x = Math.random() * width; this.y = Math.random() * -height;
                    this.type = Math.random() > 0.8 ? 'flower' : 'petal';
                    this.size = this.type === 'flower' ? Math.random() * 2 + 6 : Math.random() * 3 + 7;
                    this.colorType = Math.random() > 0.7 ? 'peach' : 'light';
                    this.speedX = Math.random() * 1 - 0.5; this.speedY = Math.random() * 1.2 + 0.8;
                    this.rotation = Math.random() * 360; this.rotationSpeed = Math.random() * 2 - 1;
                    this.opacity = Math.random() * 0.4 + 0.5;
                }
                update() {
                    this.x += this.speedX + Math.sin(this.y * 0.005) * 0.5; this.y += this.speedY; this.rotation += this.rotationSpeed;
                    if (this.y > height + 20) { this.reset(); }
                }
                drawPetalPath(s) {
                    ctx.beginPath(); ctx.moveTo(0, 0); ctx.bezierCurveTo(-s, -s * 0.5, -s * 0.5, -s * 1.5, 0, -s); ctx.bezierCurveTo(s * 0.5, -s * 1.5, s, -s * 0.5, 0, 0); ctx.closePath();
                }
                draw() {
                    ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.rotation * Math.PI / 180); ctx.globalAlpha = this.opacity;
                    let gradient = ctx.createLinearGradient(-this.size, -this.size, 0, this.size);
                    if (this.colorType === 'peach') {
                        gradient.addColorStop(0, "rgba(255, 182, 193, 1)"); gradient.addColorStop(1, "rgba(255, 105, 180, 1)"); 
                    } else {
                        gradient.addColorStop(0, "rgba(255, 240, 245, 1)"); gradient.addColorStop(1, "rgba(255, 192, 203, 1)"); 
                    }
                    ctx.fillStyle = gradient;
                    if (this.type === 'flower') {
                        for (let i = 0; i < 5; i++) {
                            ctx.save(); ctx.rotate((72 * i) * Math.PI / 180); ctx.translate(0, -this.size * 0.2); this.drawPetalPath(this.size); ctx.fill(); ctx.restore();
                        }
                        ctx.beginPath(); ctx.arc(0, 0, this.size * 0.25, 0, Math.PI * 2); ctx.fillStyle = this.colorType === 'peach' ? 'rgba(255, 255, 150, 0.9)' : 'rgba(255, 255, 200, 0.9)'; ctx.fill();
                    } else {
                        this.drawPetalPath(this.size); ctx.fill();
                    }
                    ctx.restore();
                }
            }
            for (let i = 0; i < totalPetals; i++) { petals.push(new Petal()); }
            function animate() { ctx.clearRect(0, 0, width, height); petals.forEach(petal => { petal.update(); petal.draw(); }); requestAnimationFrame(animate); }
            animate();
        });
    </script>
</body>

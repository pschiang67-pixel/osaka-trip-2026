    <style>
        /* Base Settings - Dark Mode */
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #121212; /* Deep Black Background */
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
            overscroll-behavior-y: none; /* Prevent bounce */
            color: #1d1d1f; 
        }

        /* App Container - Dark Mode */
        #app-frame {
            max-width: 480px;
            margin: 0 auto;
            background-color: #121212; /* Match body background */
            height: 100vh;
            max-height: 100vh;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.5); /* Stronger shadow for depth */
            display: flex;
            flex-direction: column;
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Font Setting for FangSong style */
        .font-fangsong {
            font-family: "Huiwen Fangsong", "FangSong", "STFangsong", "Noto Serif TC", serif;
        }

        /* Washi Paper Texture for Modals
           Using a subtle noise pattern svg data uri and a warm off-white color 
        */
        .washi-paper {
            background-color: #fdfbf7;
            background-image: url("data:image/svg+xml,%3Csvg width='200' height='200' viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E");
        }
        
        /* Utility class for masking image edges to fade into background */
        .img-mask-fade {
            -webkit-mask-image: radial-gradient(ellipse at center, black 60%, transparent 100%);
            mask-image: radial-gradient(ellipse at center, black 60%, transparent 100%);
        }

        /* Gold Gradient Text */
        .gold-text {
            color: #bfa15f; /* Fallback */
            background: linear-gradient(45deg, #bf953f, #cfb53b, #b38728, #e3c457, #aa771c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Floating Card Style (White Card on Dark Bg) */
        .float-card {
            background-color: #ffffff;
            border-radius: 1.2rem;
            /* Layered shadow for floating effect on dark bg */
            box-shadow: 
                0 4px 6px -1px rgba(0, 0, 0, 0.3), 
                0 12px 20px -4px rgba(0, 0, 0, 0.4);
            /* No border needed for white card on black bg */
            border: none; 
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .float-card:active {
            transform: scale(0.98);
            box-shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.5);
        }

        /* Hero Image Card Height */
        .hero-overlay {
            position: absolute;
            inset: 0;
            /* Seamless blend to #121212 */
            background: linear-gradient(to bottom, 
                rgba(0,0,0,0.4) 0%, 
                rgba(0,0,0,0.1) 40%, 
                rgba(18,18,18,0.7) 80%, 
                #121212 100%);
        }

        /* Frosted Glass - Weather Widget */
        .glass-weather {
            background: rgba(0, 0, 0, 0.4); /* Darker glass for better contrast */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* Scrollable Content Container */
        .scrollable-content {
            overflow-y: auto;
            padding-bottom: 100px;
            scrollbar-width: none; 
        }
        .scrollable-content::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>

                    <template x-if="selectedEvent">

    <!-- Sakura Animation Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('sakura-canvas');
            const ctx = canvas.getContext('2d');
            
            let width, height;
            
            function resize() {
                const rect = canvas.parentElement.getBoundingClientRect();
                width = rect.width;
                height = rect.height;
                canvas.width = width;
                canvas.height = height;
            }
            
            window.addEventListener('resize', resize);
            resize();

            const petals = [];
            const totalPetals = 30;

            class Petal {
                constructor() {
                    this.reset();
                }

                reset() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * -height; 
                    
                    this.type = Math.random() > 0.8 ? 'flower' : 'petal';
                    this.size = this.type === 'flower' ? Math.random() * 2 + 6 : Math.random() * 3 + 7;
                    
                    // Randomly assign color: 30% Peach (Darker), 70% Light Pink
                    this.colorType = Math.random() > 0.7 ? 'peach' : 'light';

                    this.speedX = Math.random() * 1 - 0.5;
                    this.speedY = Math.random() * 1.2 + 0.8;
                    this.rotation = Math.random() * 360;
                    this.rotationSpeed = Math.random() * 2 - 1;
                    this.opacity = Math.random() * 0.4 + 0.5;
                }

                update() {
                    this.x += this.speedX + Math.sin(this.y * 0.005) * 0.5;
                    this.y += this.speedY;
                    this.rotation += this.rotationSpeed;

                    if (this.y > height + 20) {
                        this.reset();
                    }
                }

                drawPetalPath(s) {
                    ctx.beginPath();
                    ctx.moveTo(0, 0); 
                    ctx.bezierCurveTo(-s, -s * 0.5, -s * 0.5, -s * 1.5, 0, -s); 
                    ctx.bezierCurveTo(s * 0.5, -s * 1.5, s, -s * 0.5, 0, 0);
                    ctx.closePath();
                }

                draw() {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotation * Math.PI / 180);
                    ctx.globalAlpha = this.opacity;
                    
                    let gradient = ctx.createLinearGradient(-this.size, -this.size, 0, this.size);
                    
                    if (this.colorType === 'peach') {
                        // Peach / Darker Pink (New)
                        gradient.addColorStop(0, "rgba(255, 218, 233, 1)"); 
                        gradient.addColorStop(1, "rgba(255, 105, 140, 1)"); 
                    } else {
                        // Light Pink / White (Original) - slightly tweaked for visibility on dark
                        gradient.addColorStop(0, "rgba(255, 245, 250, 1)"); 
                        gradient.addColorStop(1, "rgba(255, 200, 210, 1)"); 
                    }
                    
                    ctx.fillStyle = gradient;

                    if (this.type === 'flower') {
                        for (let i = 0; i < 5; i++) {
                            ctx.save();
                            ctx.rotate((72 * i) * Math.PI / 180);
                            ctx.translate(0, -this.size * 0.2); 
                            this.drawPetalPath(this.size);
                            ctx.fill();
                            ctx.restore();
                        }
                        ctx.beginPath();
                        ctx.arc(0, 0, this.size * 0.25, 0, Math.PI * 2);
                        // Center color also adjusts slightly
                        ctx.fillStyle = this.colorType === 'peach' ? 'rgba(255, 255, 200, 0.9)' : 'rgba(255, 255, 220, 0.9)';
                        ctx.fill();
                    } else {
                        this.drawPetalPath(this.size);
                        ctx.fill();
                    }
                    
                    ctx.restore();
                }
            }

            for (let i = 0; i < totalPetals; i++) {
                petals.push(new Petal());
            }

            function animate() {
                ctx.clearRect(0, 0, width, height);
                petals.forEach(petal => {
                    petal.update();
                    petal.draw();
                });
                requestAnimationFrame(animate);
            }

            animate();
        });
    </script>

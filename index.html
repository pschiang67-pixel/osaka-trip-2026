                    if (this.newExpense.name && this.newExpense.amount) {
                        const amount = parseInt(this.newExpense.amount);
                        this.expenses.unshift({
                            name: this.newExpense.name,
                            amount: amount,
                            amountTWD: Math.round(amount * this.exchangeRate),
                            category: this.newExpense.category,
                            paymentMethod: this.newExpense.paymentMethod,
                            date: new Date().toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric' })
                        });
                        this.totalExpenseJPY += amount;
                        this.newExpense.name = '';
                        this.newExpense.amount = '';
                        this.newExpense.paymentMethod = 'cash';
                        this.showAddExpense = false;
                        this.showCategoryMenu = false;
                    }
                },

    <style>
        /* Base Settings */
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f6f7f9; /* Paper-like off-white background */
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
            overscroll-behavior-y: none; /* Prevent bounce */
        }

        /* App Container */
        #app-frame {
            max-width: 480px;
            margin: 0 auto;
            background-color: #f6f7f9; /* Match body background */
            height: 100vh;
            max-height: 100vh;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Font Setting for FangSong style */
        .font-fangsong {
            font-family: "Huiwen Fangsong", "FangSong", "STFangsong", "Noto Serif TC", serif;
        }

        /* Floating Card Style (The core of the new design) */
        .float-card {
            background-color: #ffffff;
            border-radius: 1.2rem;
            /* Layered shadow for floating effect */
            box-shadow: 
                0 4px 6px -1px rgba(0, 0, 0, 0.02), 
                0 12px 20px -4px rgba(0, 0, 0, 0.05);
            /* Very subtle white border to make it pop */
            border: 1px solid rgba(255, 255, 255, 0.8); 
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .float-card:active {
            transform: scale(0.98);
            box-shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        /* Hero Image Card Height */
        /* Changed from fixed class to utility usage in HTML, keeping clean here */
        
        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, 
                rgba(0,0,0,0.2) 0%, 
                rgba(0,0,0,0) 40%, 
                rgba(0,0,0,0.5) 80%, 
                rgba(0,0,0,0.8) 100%);
        }

        /* Frosted Glass - Weather Widget */
        .glass-weather {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        /* Scrollable Content Container */
        .scrollable-content {
            overflow-y: auto;
            padding-bottom: 100px;
            scrollbar-width: none; 
        }
        .scrollable-content::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body x-data="appData()">

    <!-- App Frame Wrapper -->
    <div id="app-frame">

        <!-- ===== HOME TAB ===== -->
        <div class="flex flex-col h-full w-full" x-show="activeTab === 'home'">
            
            <!-- 1. Hero Section (Rectangular with shadow, tight bottom) -->
            <!-- Changed pt-5 to pt-0 to remove top whitespace. Kept px-5 for side margins. -->
            <div class="px-5 pt-0 pb-0 flex-shrink-0">
                <!-- Removed 'float-card' to remove border-radius. Added manual shadow and border for float effect without rounding. -->
                <div class="relative overflow-hidden h-[30vh] bg-white shadow-[0_4px_6px_-1px_rgba(0,0,0,0.02),0_12px_20px_-4px_rgba(0,0,0,0.05)] border-x border-b border-white/80">
                    
                    <!-- New Title Overlay (Moved Top-Left, Two Lines) -->
                    <div class="absolute top-3 left-4 z-20 text-white drop-shadow-md border-l-2 border-white/90 pl-3 py-1 text-left">
                        <div class="font-bold tracking-[0.1em] text-sm opacity-90 mb-0.5">2026。春</div>
                        <div class="font-bold tracking-[0.15em] text-xl leading-none">京阪家族旅行</div>
                    </div>

                    <!-- Updated onerror to fallback to a nice Unsplash image instead of a gray placeholder for better preview experience -->
                    <img :src="days[selectedDay].heroImg" class="w-full h-full object-cover transition-opacity duration-700" alt="Hero" onerror="this.src='https://images.unsplash.com/photo-1590559399607-90d523102a9e?q=80&w=1000&auto=format&fit=crop'">
                    <div class="hero-overlay"></div>

                    <!-- Weather Widget (Top Right) -->
                    <div class="absolute top-4 right-4 z-20">
                        <div class="glass-weather p-2 pl-3 flex items-center gap-2 text-white">
                            <div class="flex flex-col items-center pr-2 border-r border-white/30">
                                <span class="text-[10px] font-bold tracking-wider">大阪</span>
                                <i class="fas fa-cloud-sun text-xs mt-0.5"></i>
                            </div>
                            <div class="flex overflow-x-auto no-scrollbar gap-2 max-w-[100px]">
                                <template x-for="hour in weatherForecast" :key="hour.time">
                                    <div class="flex flex-col items-center flex-shrink-0 min-w-[20px]">
                                        <span class="text-[8px] opacity-90" x-text="hour.time"></span>
                                        <span class="text-[9px] font-bold mt-0.5" x-text="hour.temp"></span>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>

                    <!-- Day Title (Moved to Bottom Right & Smaller) -->
                    <div class="absolute bottom-12 right-6 z-20 text-right">
                        <!-- Changed text-white/80 to text-white/60 (increased transparency) -->
                        <h1 class="text-sm font-bold text-white/60 leading-tight drop-shadow-md tracking-wide" x-text="days[selectedDay].title"></h1>
                        <!-- Changed text-white/70 to text-white/50 (increased transparency) -->
                        <span class="text-white/50 text-[9px] font-medium tracking-wide drop-shadow-sm block mt-1" x-text="days[selectedDay].subtitle"></span>
                    </div>

                    <!-- Date Tabs (Overlapping Bottom Edge) -->
                    <!-- Reduced font size to text-sm, kept tight spacing -->
                    <div class="absolute bottom-0 w-full z-30 flex justify-between px-6 pb-1">
                        <template x-for="(day, index) in days" :key="index">
                            <button @click="selectedDay = index" 
                                    class="flex flex-col items-center justify-end transition-all duration-300 group pb-2"
                                    :class="selectedDay === index ? 'opacity-100 translate-y-0' : 'opacity-60 hover:opacity-80'">
                                <span class="text-sm font-bold text-white leading-none font-mono drop-shadow-md" x-text="day.dateLabel"></span>
                                <div class="h-1 rounded-full bg-white mt-1 transition-all duration-300 shadow-sm"
                                     :class="selectedDay === index ? 'w-full opacity-100' : 'w-0 opacity-0'"></div>
                            </button>
                        </template>
                    </div>
                </div>
            </div>

            <!-- 2. Content Section (70% Height - Scrollable) -->
            <!-- Changed pt-0 to pt-5 to add approx 5mm (20px) top spacing -->
            <div class="flex-1 relative z-10 px-5 pt-5 scrollable-content bg-[#f6f7f9]">
                
                <!-- Vertical Timeline Cards -->
                <div class="space-y-0 pb-8 relative">
                    <!-- Template Loop -->
                    <template x-for="(spot, index) in days[selectedDay].events" :key="spot.id || spot.title">
                        <div class="relative z-10 flex">
                            
                            <!-- Timeline Left Column -->
                            <!-- Reduced width from 2.5rem to 2rem (20% reduction), Reduced mr-4 to mr-2 -->
                            <div class="flex flex-col items-center mr-2 w-[2rem] flex-shrink-0 relative">
                                <!-- Time Label -->
                                <span class="text-[10px] font-bold text-slate-400 font-mono mb-1 pt-2" x-text="spot.time"></span>
                                
                                <!-- Dot (Unified Style: Amber-500 like Day 3) -->
                                <div class="w-2.5 h-2.5 rounded-full border-2 border-[#f6f7f9] shadow-sm z-10 bg-amber-500"></div>
                                
                                <!-- Connecting Line -->
                                <div class="w-0.5 bg-slate-200/60 flex-1 my-1" 
                                     x-show="index !== days[selectedDay].events.length - 1"></div>
                            </div>

                            <!-- Content Column -->
                            <div class="flex-1 pb-4"> <!-- Spacing between cards via padding -->
                                
                                <!-- Split View -->
                                <template x-if="spot.type === 'split'">
                                    <div class="grid grid-cols-2 gap-3 h-full">
                                        <template x-for="subSpot in spot.items" :key="subSpot.id || subSpot.title">
                                            <div @click="openModal(subSpot)" 
                                                 class="float-card p-3 flex flex-col gap-2 relative overflow-hidden group cursor-pointer h-full">
                                                
                                                <!-- REMOVED IMAGE -->

                                                <!-- Content Centered -->
                                                <div class="flex-1 flex flex-col justify-center items-center text-center w-full">
                                                    <!-- Time with color indicator -->
                                                    <div class="flex items-center gap-1 mb-2">
                                                        <div class="w-1.5 h-1.5 rounded-full" :class="subSpot.colorClass.replace('border-l-4', 'bg')"></div>
                                                        <span class="text-[9px] font-bold text-slate-400 font-mono" x-text="subSpot.time"></span>
                                                    </div>
                                                    
                                                    <!-- Title (Fangsong, Larger) -->
                                                    <h3 class="font-fangsong font-bold text-slate-800 text-lg leading-tight mb-2" x-text="subSpot.title"></h3>
                                                    
                                                    <!-- Desc -->
                                                    <p class="text-[10px] text-slate-400 line-clamp-2 leading-relaxed" x-text="subSpot.desc"></p>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </template>

                                <!-- Normal Card -->
                                <template x-if="!spot.type">
                                    <div @click="openModal(spot)" 
                                         class="float-card p-4 flex gap-4 relative overflow-hidden group cursor-pointer h-full">
                                        
                                        <!-- Color Stripe -->
                                        <div class="absolute left-0 top-0 bottom-0 w-1" :class="spot.colorClass ? spot.colorClass.replace('border-l-4', 'bg') : 'bg-gray-200'"></div>
                                        
                                        <!-- Content Centered -->
                                        <div class="flex-1 flex flex-col justify-center items-center text-center w-full py-2">
                                            
                                            <!-- Title (Fangsong, Large) -->
                                            <h3 class="font-fangsong font-bold text-slate-800 text-2xl leading-tight mb-2" x-text="spot.title"></h3>
                                            
                                            <p class="text-xs text-slate-500 mb-2 line-clamp-2 leading-relaxed font-light" x-text="spot.desc"></p>
                                            
                                            <!-- REMOVED Tags Centered (Must Eat Icon) -->
                                        </div>
                                        
                                        <!-- REMOVED Arrow & Image Thumbnail -->
                                    </div>
                                </template>

                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>

        <!-- ===== WALLET TAB: Content ===== -->
        <main class="flex-1 bg-[#f6f7f9] relative z-10 scrollable-content p-6 pt-12" x-show="activeTab === 'wallet'" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100">
            <h2 class="text-xl font-bold text-slate-800 mb-6">記帳小幫手</h2>
            
            <!-- Total Card (Dark card for contrast, but with float shadow) -->
            <div class="bg-[#1d1d1f] text-white rounded-2xl p-6 mb-8 relative overflow-hidden" 
                 style="box-shadow: 0 10px 30px -10px rgba(0,0,0,0.3);">
                <div class="absolute -top-10 -right-10 w-32 h-32 bg-gray-700 rounded-full blur-3xl opacity-30"></div>
                <div class="flex justify-between items-start mb-4">
                    <p class="text-xs text-gray-400 font-medium">總支出 (日幣)</p>
                    <span class="text-[10px] bg-gray-800 border border-gray-700 px-2 py-1 rounded text-gray-400">匯率 0.20</span>
                </div>
                <h3 class="text-3xl font-bold tracking-tight mb-1">¥ <span x-text="totalExpenseJPY.toLocaleString()"></span></h3>
                <p class="text-gray-400 text-xs font-medium mb-6">
                    ≈ NT$ <span x-text="Math.round(totalExpenseJPY * exchangeRate).toLocaleString()"></span>
                </p>
                <button @click="showAddExpense = true" class="w-full bg-white text-black py-3 rounded-xl text-xs font-bold hover:bg-gray-100 active:scale-95 transition-all flex items-center justify-center shadow-lg">
                    <i class="fas fa-plus mr-2"></i> 記一筆
                </button>
            </div>

            <!-- Expense List -->
            <div class="mb-3 flex justify-between items-center">
                <h3 class="text-sm font-bold text-slate-700">最近紀錄</h3>
                <span class="text-[10px] text-slate-400" x-text="expenses.length + ' 筆'"></span>
            </div>

            <div class="float-card p-1 min-h-[200px]">
                <ul class="divide-y divide-slate-100">
                    <template x-for="(item, index) in expenses" :key="index">
                        <li class="flex justify-between items-center p-3 hover:bg-slate-50 transition-colors rounded-xl">
                            <div class="flex items-center gap-3">
                                <div class="w-9 h-9 rounded-full flex items-center justify-center text-sm shadow-sm"
                                     :class="getCategory(item.category).color">
                                    <i :class="getCategory(item.category).icon"></i>
                                </div>
                                <div>
                                    <div class="flex items-center gap-2 mb-0.5">
                                        <p class="font-bold text-slate-700 text-xs" x-text="item.name"></p>
                                        <span x-show="item.paymentMethod === 'card'" class="text-[9px] text-slate-400 bg-slate-100 px-1 rounded">
                                            <i class="fas fa-credit-card"></i>
                                        </span>
                                    </div>
                                    <p class="text-[9px] text-slate-400 font-medium" x-text="item.date"></p>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="font-bold text-slate-800 text-xs">-¥<span x-text="item.amount.toLocaleString()"></span></div>
                                <div class="text-[9px] text-slate-400">NT$<span x-text="item.amountTWD.toLocaleString()"></span></div>
                            </div>
                        </li>
                    </template>
                    <li x-show="expenses.length === 0" class="py-10 flex flex-col items-center justify-center text-slate-300">
                        <i class="fas fa-receipt text-2xl mb-2 opacity-50"></i>
                        <span class="text-[10px]">尚無支出</span>
                    </li>
                </ul>
            </div>
        </main>

        <!-- BOTTOM NAVIGATION BAR -->
        <nav class="absolute bottom-0 w-full z-40 px-6 pb-8 pt-4 pointer-events-none">
            <div class="pointer-events-auto bg-[#1d1d1f]/90 backdrop-blur-md rounded-full h-16 flex items-center justify-around shadow-2xl border border-white/10 mx-auto max-w-[280px]">
                <button @click="activeTab = 'home'" :class="{'text-white': activeTab === 'home', 'text-white/40 hover:text-white/60': activeTab !== 'home'}" class="flex flex-col items-center justify-center w-full h-full transition-colors group">
                    <i class="fas fa-compass text-xl mb-1 transition-transform group-active:scale-90"></i>
                    <span class="text-[9px] font-bold tracking-wider">行程</span>
                </button>
                <div class="w-px h-6 bg-white/20"></div>
                <button @click="activeTab = 'wallet'" :class="{'text-white': activeTab === 'wallet', 'text-white/40 hover:text-white/60': activeTab !== 'wallet'}" class="flex flex-col items-center justify-center w-full h-full transition-colors group">
                    <i class="fas fa-wallet text-xl mb-1 transition-transform group-active:scale-90"></i>
                    <span class="text-[9px] font-bold tracking-wider">記帳</span>
                </button>
            </div>
        </nav>

        <!-- MODALS (Add Expense & Details) -->
        <!-- Add Expense Sheet -->
        <div x-show="showAddExpense" class="absolute inset-0 z-50 flex items-end justify-center pointer-events-none">
            <div x-show="showAddExpense" @click="showAddExpense = false" x-transition.opacity class="absolute inset-0 bg-black/40 pointer-events-auto backdrop-blur-sm"></div>
            <div x-show="showAddExpense" x-transition:enter="transition transform ease-out duration-300" x-transition:enter-start="translate-y-full" x-transition:enter-end="translate-y-0" x-transition:leave="transition transform ease-in duration-200" x-transition:leave-start="translate-y-0" x-transition:leave-end="translate-y-full" class="bg-[#f6f7f9] w-full rounded-t-[2rem] p-6 pointer-events-auto pb-10 shadow-2xl relative">
                <div class="w-10 h-1 bg-gray-300 rounded-full mx-auto mb-6"></div>
                <h3 class="text-lg font-bold mb-4 text-slate-800">記一筆</h3>
                <div class="space-y-3">
                    <input type="text" x-model="newExpense.name" placeholder="項目名稱" class="w-full bg-white border border-white/80 shadow-sm rounded-xl p-3 text-sm font-medium focus:ring-2 focus:ring-slate-800 outline-none">
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 font-bold text-sm">¥</span>
                        <input type="number" x-model="newExpense.amount" placeholder="0" class="w-full bg-white border border-white/80 shadow-sm rounded-xl p-3 pl-8 text-lg font-bold focus:ring-2 focus:ring-slate-800 outline-none">
                        <div class="absolute right-4 top-1/2 -translate-y-1/2 text-[10px] text-slate-400" x-show="newExpense.amount > 0">
                            ≈ NT$ <span x-text="Math.round(newExpense.amount * exchangeRate).toLocaleString()"></span>
                        </div>
                    </div>
                    
                    <div class="bg-white p-1 rounded-xl flex shadow-sm border border-white/80">
                        <template x-for="method in paymentMethods" :key="method.id">
                            <button @click="newExpense.paymentMethod = method.id"
                                    class="flex-1 py-2 rounded-lg text-[10px] font-bold transition-all flex items-center justify-center gap-2"
                                    :class="newExpense.paymentMethod === method.id ? 'bg-slate-800 text-white shadow-md' : 'text-slate-400 hover:bg-slate-50'">
                                <i :class="method.icon"></i> <span x-text="method.name"></span>
                            </button>
                        </template>
                    </div>

                    <div class="relative">
                        <button @click="showCategoryMenu = !showCategoryMenu" class="w-full bg-white shadow-sm border border-white/80 rounded-xl p-3 flex items-center justify-between text-xs font-bold text-slate-700">
                            <div class="flex items-center gap-3">
                                <div class="w-5 h-5 rounded-full flex items-center justify-center text-[10px]" :class="getCategory(newExpense.category).color">
                                    <i :class="getCategory(newExpense.category).icon"></i>
                                </div>
                                <span x-text="getCategory(newExpense.category).name"></span>
                            </div>
                            <i class="fas fa-chevron-down text-slate-400"></i>
                        </button>
                        <div x-show="showCategoryMenu" @click.away="showCategoryMenu = false" class="absolute bottom-full mb-2 w-full bg-white border border-gray-100 rounded-xl shadow-xl max-h-40 overflow-y-auto z-20">
                            <template x-for="cat in categories" :key="cat.id">
                                <button @click="newExpense.category = cat.id; showCategoryMenu = false" class="w-full p-2 flex items-center gap-3 hover:bg-gray-50 border-b border-gray-50 last:border-0">
                                    <div class="w-5 h-5 rounded-full flex items-center justify-center text-[10px]" :class="cat.color"><i :class="cat.icon"></i></div>
                                    <span class="text-xs font-bold text-gray-700" x-text="cat.name"></span>
                                </button>
                            </template>
                        </div>
                    </div>

                    <button @click="addExpense()" class="w-full bg-slate-800 text-white py-3 rounded-xl font-bold shadow-lg mt-2 active:scale-95 transition-transform text-sm">確認</button>
                </div>
            </div>
        </div>

        <!-- Detail Sheet -->
        <div x-show="showDetailModal" class="fixed inset-0 z-50 flex items-end justify-center">
            <div x-show="showDetailModal" @click="closeModal()" x-transition.opacity class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>
            
            <div x-show="showDetailModal" 
                 x-transition:enter="transition transform ease-out duration-300" 
                 x-transition:enter-start="translate-y-full" 
                 x-transition:enter-end="translate-y-0" 
                 x-transition:leave="transition transform ease-in duration-200" 
                 x-transition:leave-start="translate-y-0" 
                 x-transition:leave-end="translate-y-full" 
                 class="bg-[#f6f7f9] w-full h-[75vh] rounded-t-[2rem] shadow-2xl flex flex-col overflow-hidden relative z-50 max-w-[480px]">
                
                <!-- Modal Header -->
                <div class="p-6 pb-0 bg-[#f6f7f9] z-10 flex-shrink-0">
                    <div class="w-10 h-1 bg-gray-300 rounded-full mx-auto mb-6"></div>
                    <template x-if="selectedEvent">
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="text-[10px] font-bold text-blue-600 bg-blue-50 px-2 py-1 rounded mb-2 inline-block shadow-sm" x-text="selectedEvent.time"></span>
                                <h2 class="text-xl font-bold text-slate-800 font-fangsong" x-text="selectedEvent.title"></h2>
                            </div>
                            <button @click="closeModal()" class="w-8 h-8 rounded-full bg-white flex items-center justify-center text-slate-400 hover:bg-gray-50 transition-colors shadow-sm"><i class="fas fa-times"></i></button>
                        </div>
                    </template>
                </div>
                
                <!-- Modal Content (Scrollable) -->
                <div class="overflow-y-auto p-6 flex-1 pb-24"> 
                    <template x-if="selectedEvent">
                        <div class="space-y-6">
                            <!-- Image -->
                            <div class="w-full h-48 bg-gray-200 rounded-2xl overflow-hidden relative flex-shrink-0 shadow-md border border-white">
                                <img :src="selectedEvent.img" class="w-full h-full object-cover">
                            </div>
                            
                            <!-- Highlights -->
                            <div class="float-card p-4 flex-shrink-0">
                                <h3 class="font-bold text-slate-800 mb-2 text-xs flex items-center uppercase tracking-wide opacity-80"><i class="fas fa-lightbulb text-yellow-500 mr-2"></i> 亮點</h3>
                                <p class="text-sm text-slate-600 leading-relaxed font-medium" x-text="selectedEvent.highlights"></p>
                            </div>
                            
                            <!-- Food -->
                            <div x-show="selectedEvent.food" class="flex-shrink-0">
                                <h3 class="font-bold text-slate-800 mb-3 text-xs flex items-center uppercase tracking-wide opacity-80"><i class="fas fa-utensils text-orange-500 mr-2"></i> 推薦美食</h3>
                                <div class="grid gap-2">
                                    <template x-for="food in selectedEvent.foodList" :key="food">
                                        <div class="flex items-center p-3 bg-white border border-white/80 rounded-xl shadow-sm">
                                            <span class="w-1.5 h-1.5 bg-orange-400 rounded-full mr-3"></span>
                                            <span class="text-xs font-bold text-slate-700" x-text="food"></span>
                                        </div>
                                    </template>
                                </div>
                            </div>
                            
                            <!-- Tips -->
                            <div x-show="selectedEvent.tips" class="flex-shrink-0">
                                <h3 class="font-bold text-slate-800 mb-2 text-xs flex items-center uppercase tracking-wide opacity-80"><i class="fas fa-info-circle text-blue-500 mr-2"></i> 貼心小提醒</h3>
                                <p class="text-xs text-slate-500 leading-relaxed pl-6 border-l-2 border-blue-200 ml-1 py-1" x-text="selectedEvent.tips"></p>
                            </div>
                            
                            <!-- Navigation Button -->
                            <div class="pt-4">
                                <a :href="'https://www.google.com/maps/search/?api=1&query=' + selectedEvent.title" target="_blank" class="flex items-center justify-center w-full bg-blue-600 text-white py-4 rounded-xl font-bold shadow-lg shadow-blue-200 hover:bg-blue-700 active:scale-95 transition-all text-sm flex-shrink-0">
                                    <i class="fas fa-location-arrow mr-2"></i> 導航去
                                </a>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>

    </div> <!-- End App Frame -->
</body>
</html>
